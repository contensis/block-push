name: "Contensis Block Push"
description: "A GitHub Action for pushing a Block to a Contensis CMS"
author: "Zengenti"

branding:
  icon: "package"
  color: "green"

inputs:
  alias:
    description: "The Contensis cloud alias to connect to."
    required: true
  project-id:
    description: "The id of the project to connect to."
    required: false
    default: website
  client-id:
    description: "Client id to connect to the supplied alias."
    required: true
  shared-secret:
    description: "Shared secret to use with the supplied client id."
    required: true
  block-id:
    description: "The id of the block to push to."
    required: true
  image-uri:
    description: "The repository URI of the container image to build the block from"
    required: false
    default: ghcr.io/${{ github.repository }}/${{ github.ref_name }}/app:latest
  branch:
    description: "The branch name in Contensis to push the block to"
    required: false
    default: ${{ github.ref_name }}
  release:
    description: "Whether to release the Block upon successful push"
    required: false
    default: false
  auto-release:
    description: "Whether to release the Block upon successful push (deprecated: see 'release')"
    required: false
    default: false
  make-live:
    description: "Whether to make the Block live upon successful push"
    required: false
    default: false
  tag-repo:
    description: "Whether to push a tag to the git repo upon successful Block push"
    required: false
    default: false
  git-token:
    description: "The git token from secrets to use when tagging the git repo upon successful Block push"
    required: false
    default: ${{ github.token }}
  cli-version:
    description: "Optional: pull cli from specified tag. Default: release"
    default: latest

outputs:
  block-version:
    description: "The version number of the pushed Block"
    value: ${{ steps.set.outputs.block-version }}
  git-tag:
    description: "The pushed tag name if tag-repo input is true"
    value: ${{ steps.tag.outputs.git-tag }}

runs:
  using: "composite"

  steps:
    # Commit provenance travels as CONTENSIS_* env vars, never in the command
    # string (issue #2): cli-action tokenises the command without shell
    # expansion, and forwards only CONTENSIS_*/GITHUB_* env into the cli
    # container, where the cli reads these.
    - name: Export commit provenance
      shell: bash
      env:
        REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        COMMIT_ID: ${{ github.sha }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_DATETIME: ${{ github.event.head_commit.timestamp }}
        AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        COMMITTER_EMAIL: ${{ github.event.head_commit.committer.email }}
      run: |
        # workflow_dispatch runs have no push payload; use the checked-out
        # commit (that is the commit the workflow ran on), when there is one.
        if git rev-parse --verify -q HEAD >/dev/null 2>&1; then
          COMMIT_MESSAGE="${COMMIT_MESSAGE:-$(git log -1 --format=%B)}"
          COMMIT_DATETIME="${COMMIT_DATETIME:-$(git log -1 --format=%cI)}"
          AUTHOR_EMAIL="${AUTHOR_EMAIL:-$(git log -1 --format=%aE)}"
          COMMITTER_EMAIL="${COMMITTER_EMAIL:-$(git log -1 --format=%cE)}"
        fi

        # Flatten real newlines: GITHUB_ENV stores one NAME=VALUE per line, and
        # the API has only ever received single-line messages (GitLab's arrive
        # escaped and the cli flattens those) - so keep parity.
        CONTENSIS_COMMIT_MESSAGE="${COMMIT_MESSAGE//$'\r'/}"
        CONTENSIS_COMMIT_MESSAGE="${CONTENSIS_COMMIT_MESSAGE//$'\n'/ }"

        # Export everything unconditionally; empty values are skipped by the
        # cli, which then falls back to its own CI defaults. (These vars also
        # remain set for later steps of the calling job - normal composite
        # behaviour, and all describe this job's single commit.)
        {
          echo "CONTENSIS_REPOSITORY_URL=$REPOSITORY_URL"
          echo "CONTENSIS_COMMIT_ID=$COMMIT_ID"
          echo "CONTENSIS_COMMIT_MESSAGE=$CONTENSIS_COMMIT_MESSAGE"
          echo "CONTENSIS_COMMIT_DATETIME=$COMMIT_DATETIME"
          echo "CONTENSIS_AUTHOR_EMAIL=$AUTHOR_EMAIL"
          echo "CONTENSIS_COMMITTER_EMAIL=$COMMITTER_EMAIL"
        } >> "$GITHUB_ENV"

    - name: Pull Contensis CLI docker image and run commands
      id: cli
      uses: contensis/cli-action@fix-shell-parsing
      with:
        alias: ${{ inputs.alias }}
        project-id: ${{ inputs.project-id}}
        client-id: ${{ inputs.client-id }}
        shared-secret: ${{ inputs.shared-secret }}
        command: push block ${{ inputs.block-id }} ${{ inputs.image-uri }} ${{ inputs.branch }}${{ (inputs.release == 'true' || inputs.auto-release == 'true') && ' --release' || '' }}${{ (inputs.make-live == 'true') && ' --make-live' || '' }} --provider Github
        cli-version: ${{ inputs.cli-version }}
        cli-splash: true

    - name: Set output variables
      id: set
      shell: bash
      env:
        COMMAND_OUTPUT: ${{ steps.cli.outputs.command-output }}
      run: |
        # Parse with python3 (already required by cli-action) rather than jq, which
        # self-hosted runners may lack. Prints "" for missing/invalid output so the
        # -z check below catches it.
        VERSION_NO=$(printf '%s' "$COMMAND_OUTPUT" | python3 -c '
        import json, sys
        try:
            print((json.load(sys.stdin).get("version") or {}).get("versionNo") or "")
        except Exception:
            print("")
        ')
        echo "Setting block-version: $VERSION_NO"
        if [ -z "$VERSION_NO" ]; then
          echo "Error next Block version was not created"
          exit 1
        fi
        echo "block-version=$VERSION_NO" >> $GITHUB_OUTPUT

    - uses: actions/checkout@v7
      with:
        token: ${{ inputs.git-token }}
      if: inputs.tag-repo == 'true' && (github.ref_name == 'master' || github.ref_name == 'main') && steps.set.outputs.block-version != ''

    - name: Tag repo with block version
      id: tag
      if: inputs.tag-repo == 'true' && (github.ref_name == 'master' || github.ref_name == 'main') && steps.set.outputs.block-version != ''
      shell: bash
      run: |
        TAG=v${{ steps.set.outputs.block-version }}
        echo "git-tag=$TAG" >> $GITHUB_OUTPUT
        echo "Tagging commit with: $TAG"
        git tag $TAG --force
        git push origin $TAG --force
